<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BreachIntel | Threat Intelligence Search</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">

            <div class="flex items-center space-x-3">
                <div class="h-3 w-3 bg-red-500 rounded-full animate-pulse"></div>

                <span class="font-bold text-lg tracking-wider text-white">
                    BREACH<span class="text-red-500">INTEL</span>
                </span>
            </div>

            <span class="text-xs px-3 py-1 bg-red-950/80 text-red-400 border border-red-800 rounded-full font-mono">
                DATABASE ACTIVE
            </span>

        </div>
    </header>


    <!-- Main -->
    <main class="max-w-3xl mx-auto px-6 py-16 w-full flex-grow">

        <!-- Hero -->
        <div class="text-center space-y-4 mb-10">

            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
                Search Your Data.
                <span class="text-red-500">Check Exposure.</span>
            </h1>

            <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto">
                Search the test database by email, username, name, or password.
            </p>

        </div>


        <!-- Search Card -->
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl relative overflow-hidden">

            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-500 via-amber-500 to-emerald-500"></div>


           <form id="searchForm" class="space-y-5" novalidate>

                <!-- Search Type -->
                <div>

                    <label
                        for="searchType"
                        class="block text-sm font-medium text-slate-300 mb-2"
                    >
                        Search Field
                    </label>

                    <select
                        id="searchType"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all text-sm"
                    >

                        <option value="email">Email Address</option>
                        <option value="username">Username</option>
                        <option value="first_name">First Name</option>
                        <option value="last_name">Last Name</option>
                        <option value="password">Password</option>

                    </select>

                </div>


                <!-- Query -->
                <div>

                    <label
                        for="query"
                        class="block text-sm font-medium text-slate-300 mb-2"
                    >
                        Search Value
                    </label>

                    <div class="flex flex-col sm:flex-row gap-3">

                        <input
                            type="text"
                            id="query"
                            required
                            placeholder="e.g. example@example.com"
                            autocomplete="off"
                            class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all font-mono text-sm"
                        >

                        <button
                            type="submit"
                            id="submitBtn"
                            class="bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-8 py-3.5 rounded-xl transition-all shadow-lg shadow-red-950 flex items-center justify-center cursor-pointer"
                        >
                            <span>Search</span>
                        </button>

                    </div>

                </div>

            </form>


            <!-- Loading -->
            <div id="loader" class="hidden mt-8 text-center py-6">

                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-800 border-t-red-500"></div>

                <p class="text-xs text-slate-400 mt-3 font-mono tracking-wider">
                    SEARCHING DATABASE...
                </p>

            </div>


            <!-- Results -->
            <div
                id="results"
                class="hidden mt-8 space-y-6"
            ></div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">

        <p>
            BreachIntel Test Environment
        </p>

    </footer>


    <!-- JavaScript -->
    <script>

        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('query');
        const searchType = document.getElementById('searchType');
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        const submitBtn = document.getElementById('submitBtn');


        // ==================================================
        // Change placeholder based on search type
        // ==================================================

        searchType.addEventListener('change', () => {

            const placeholders = {

                email: 'e.g. example@example.com',

                username: 'e.g. 123456780',

                first_name: 'e.g. Joe',

                last_name: 'e.g. Joe',

                password: 'e.g. Dummy123'

            };

            queryInput.placeholder =
                placeholders[searchType.value] || 'Enter search value';

            queryInput.value = '';

        });


        // ==================================================
        // HTML escaping
        // ==================================================

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        // ==================================================
        // Search
        // ==================================================

        form.addEventListener('submit', async (e) => {

            e.preventDefault();

            const query = queryInput.value;

            const type = searchType.value;

            if (!query) {
                return;
            }


            // Loading state
            loader.classList.remove('hidden');

            resultsDiv.classList.add('hidden');

            resultsDiv.innerHTML = '';

            submitBtn.disabled = true;


            try {

                const response = await fetch('/api/secure-check', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        type,
                        query
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || 'Search failed.'
                    );

                }


                loader.classList.add('hidden');

                resultsDiv.classList.remove('hidden');


                // ==================================================
                // Match found
                // ==================================================

                if (data.pwned) {

                    const match = data.match || {};


                    resultsDiv.innerHTML = `

                        <div class="bg-red-950/30 border border-red-900/60 rounded-xl p-6 space-y-5">

                            <div class="flex items-center space-x-3">

                                <div class="h-3 w-3 bg-red-500 rounded-full animate-pulse"></div>

                                <h3 class="text-lg font-bold text-red-400">
                                    Record Found
                                </h3>

                            </div>


                            <p class="text-sm text-slate-300">
                                A matching record was found in the test database.
                            </p>


                            <!-- Record -->
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl overflow-hidden">

                                <div class="px-4 py-3 border-b border-slate-800">

                                    <span class="text-xs font-mono uppercase tracking-wider text-slate-500">
                                        Database Record
                                    </span>

                                </div>


                                <div class="divide-y divide-slate-800/70">

                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Type
                                        </span>

                                        <span class="text-xs text-red-400 font-mono">
                                            ${escapeHtml(match.type || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            First Name
                                        </span>

                                        <span class="text-xs text-slate-300 font-mono">
                                            ${escapeHtml(match.firstName || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Last Name
                                        </span>

                                        <span class="text-xs text-slate-300 font-mono">
                                            ${escapeHtml(match.lastName || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Username
                                        </span>

                                        <span class="text-xs text-slate-300 font-mono">
                                            ${escapeHtml(match.username || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Email
                                        </span>

                                        <span class="text-xs text-slate-300 font-mono">
                                            ${escapeHtml(match.email || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Password
                                        </span>

                                        <span class="text-xs text-amber-400 font-mono">
                                            ${escapeHtml(match.password || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Source
                                        </span>

                                        <span class="text-xs text-slate-300 font-mono">
                                            ${escapeHtml(match.source || 'N/A')}
                                        </span>

                                    </div>


                                    <div class="px-4 py-3 flex justify-between gap-4">

                                        <span class="text-xs text-slate-500">
                                            Breach Date
                                        </span>

                                        <span class="text-xs text-slate-400 font-mono">
                                            ${escapeHtml(match.date || 'N/A')}
                                        </span>

                                    </div>

                                </div>

                            </div>


                            <!-- Snippet -->
                            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">

                                <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                                    Data Snippet
                                </h4>

                                <p class="text-xs text-slate-400 font-mono break-words">
                                    ${escapeHtml(
                                        match.snippet ||
                                        'No snippet available.'
                                    )}
                                </p>

                            </div>

                        </div>

                    `;

                }


                // ==================================================
                // No match
                // ==================================================

                else {

                    resultsDiv.innerHTML = `

                        <div class="bg-emerald-950/20 border border-emerald-900/50 rounded-xl p-6 text-center space-y-3">

                            <div class="inline-flex items-center justify-center h-10 w-10 bg-emerald-950 border border-emerald-800 rounded-full text-emerald-400 mb-1">
                                ✓
                            </div>

                            <h3 class="text-lg font-bold text-emerald-400">
                                No Record Found
                            </h3>

                            <p class="text-sm text-slate-400 max-w-md mx-auto">
                                No matching record was found in the current test database.
                            </p>

                        </div>

                    `;

                }


            } catch (err) {

                loader.classList.add('hidden');

                resultsDiv.classList.remove('hidden');


                resultsDiv.innerHTML = `

                    <div class="bg-amber-950/30 border border-amber-900/50 rounded-xl p-4 text-center">

                        <p class="text-sm text-amber-400">
                            ${escapeHtml(
                                err.message ||
                                'Connection error or server timeout.'
                            )}
                        </p>

                    </div>

                `;

            } finally {

                submitBtn.disabled = false;

            }

        });

    </script>

</body>
</html>
